name: Unpack Tokani website payload on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: website-sync

      - name: Unpack payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f site-payload.b64 ]; then
            echo "No site payload in branch; nothing to unpack."
            exit 0
          fi
          mkdir -p /tmp/tokani-site
          base64 --decode site-payload.b64 > /tmp/tokani-site.zip
          unzip -oq /tmp/tokani-site.zip -d /tmp/tokani-site
          cp -a /tmp/tokani-site/. .
          rm -f site-payload.b64 .website-sync-trigger

      - name: Commit website source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Tokani corporate website source"
          git push origin HEAD:website-sync
