name: Unpack Tokani website payload

on:
  push:
    branches: [main]
    paths:
      - 'site-payload.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack website
        shell: bash
        run: |
          if [ ! -f site-payload.b64 ]; then
            echo "No payload present; nothing to unpack."
            exit 0
          fi
          mkdir -p /tmp/tokani-site
          base64 --decode site-payload.b64 > /tmp/tokani-site.zip
          unzip -oq /tmp/tokani-site.zip -d /tmp/tokani-site
          cp -a /tmp/tokani-site/. .
          rm -f site-payload.b64

      - name: Commit website files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Tokani corporate website"
          git push
